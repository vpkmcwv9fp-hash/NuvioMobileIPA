name: Build Unsigned iOS IPA

on:
  workflow_dispatch: # يتيح لك تشغيل البناء يدوياً بضغطة زر

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: cmp-rewrite # استخدام الفرع الخاص بك
          submodules: 'recursive' # 🔥 هذا السطر يحل المشكلة ويقوم بتحميل MPVKit وأي مستودع فرعي آخر

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Install CocoaPods (if exists)
        run: |
          if [ -f "iosApp/Podfile" ]; then
            cd iosApp && pod install && cd ..
          fi

      - name: Build Xcode Project (Unsigned)
        run: |
          cd iosApp
          if [ -d "iosApp.xcworkspace" ]; then
            echo "Building with Workspace..."
            xcodebuild -workspace iosApp.xcworkspace \
                       -scheme iosApp \
                       -configuration Debug \
                       -sdk iphoneos \
                       -derivedDataPath "../xcode-build" \
                       CODE_SIGNING_ALLOWED=NO \
                       CODE_SIGNING_REQUIRED=NO \
                       CODE_SIGN_IDENTITY="" \
                       clean build
          else
            echo "Building with Project..."
            xcodebuild -project iosApp.xcodeproj \
                       -scheme iosApp \
                       -configuration Debug \
                       -sdk iphoneos \
                       -derivedDataPath "../xcode-build" \
                       CODE_SIGNING_ALLOWED=NO \
                       CODE_SIGNING_REQUIRED=NO \
                       CODE_SIGN_IDENTITY="" \
                       clean build
          fi
          cd ..

      - name: Package App into IPA
        run: |
          mkdir -p Payload
          cp -r xcode-build/Build/Products/Debug-iphoneos/*.app Payload/
          zip -r NuvioMobile.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NuvioMobile-Unsigned-IPA
          path: NuvioMobile.ipa
